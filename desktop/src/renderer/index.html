<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <!-- Content-Security-Policy (defence in depth): the renderer makes NO direct network
       requests (all egress goes through IPC → main), so connect-src 'self' contains any
       injected JS — it cannot POST exfiltrated data to a remote host. img-src is pinned to
       the only image CDN actually used. Scripts live in renderer.js (script-src 'self', no inline
       script); 'unsafe-inline' remains for style-src only (inline <style> and style="" attributes). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.evetech.net data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <title>Capsuleers.Intel</title>
  <style>
    :root {
      color-scheme: dark;
      --font-sans: 'Shentox', 'Rogan', 'Nunito Sans', sans-serif;
      --cap-hull: #141417; --cap-panel: #1a1a1f; --cap-panel-2: #202027;
      --cap-line: #33333c; --cap-line-soft: #26262e;
      --cap-ink: #f3f0ec; --cap-ink-2: #cfccc6; --cap-ink-3: #b3aea6;
      --cap-ok: #34d399; --cap-warn: #fbbf24; --cap-crit: #fda4af; --cap-crit-well: rgba(244,63,94,.10);
      --cap-fleet: #22d3ee;
      --cap-c1: #fb923c; --cap-c2: #0891b2; --cap-c3: #8b5cf6; --cap-c4: #059669;
      --cap-accent: #22d3ee; --cap-accent-txt: #22d3ee; --cap-accent-well: rgba(34, 211, 238, .10); --cap-accent-line: rgba(34, 211, 238, .4); --cap-on-accent: #03191d; --cap-accent-hover: #06b6d4;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; margin: 0; }
    body { background: var(--cap-hull); color: var(--cap-ink); font-family: var(--font-sans); font-size: 14px; line-height: 1.4; }
    h1, h2, h3, p { margin: 0; }
    button { font: inherit; color: inherit; }
    a { color: var(--cap-accent-txt); text-decoration: none; }
    [hidden] { display: none !important; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--cap-line); }
    ::-webkit-scrollbar-track { background: transparent; }
    :focus-visible { outline: 2px solid var(--cap-accent); outline-offset: 1px; }
    .num { font-variant-numeric: tabular-nums; }
    .ic { flex: none; display: block; }
    #app { display: grid; grid-template-rows: 40px minmax(0, 1fr); height: 100vh; min-height: 0; position: relative; overflow: hidden; }
    /* Mini-mode (always-on-top icon) */
    #mini { display: none; }
    body.mini #app { display: none; }
    body.mini #mini { display: flex; align-items: center; justify-content: center; position: fixed; inset: 0; -webkit-app-region: drag; background: var(--cap-hull); }
    #mini img { width: 66px; height: 66px; cursor: pointer; -webkit-app-region: no-drag; }
    /* titlebar */
    .tb { display: flex; align-items: center; gap: 14px; padding-left: 14px; border-bottom: 1px solid var(--cap-line); background: var(--cap-hull); -webkit-app-region: drag; user-select: none; min-width: 0; }
    .tb .mark { color: var(--cap-accent); flex: none; }
    .tb .wm { font-size: 14px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
    .tb .wm span { color: var(--cap-accent-txt); }
    .tb .sep { width: 1px; height: 18px; background: var(--cap-line); }
    .tb .st { display: flex; align-items: center; gap: 8px; }
    .tb .wc { margin-left: auto; display: flex; height: 100%; -webkit-app-region: no-drag; }
    .tb .wc button { width: 44px; height: 40px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 0; padding: 0; color: var(--cap-ink-3); cursor: pointer; }
    .tb .wc button:hover { background: var(--cap-panel-2); color: var(--cap-ink); }
    .tb .wc button.cl:hover { background: var(--cap-accent); color: var(--cap-on-accent); }
    .tb .wc .dv { width: 1px; height: 18px; align-self: center; background: var(--cap-line); margin: 0 4px; }
    .chip { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 9px; border: 1px solid var(--cap-line); background: transparent; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--cap-ink-2); white-space: nowrap; -webkit-app-region: no-drag; }
    button.chip { cursor: pointer; }
    .chip.ok { color: var(--cap-ok); border-color: rgba(52,211,153,.42); }
    .chip.off { color: var(--cap-ink-3); }
    .chip.crit { color: var(--cap-crit); border-color: rgba(253,164,175,.46); }
    .chip.warn { color: var(--cap-warn); border-color: rgba(251,191,36,.46); }
    .chip .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    /* body: rail + main */
    .bd { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 0; }
    .rl { display: flex; flex-direction: column; border-right: 1px solid var(--cap-line); padding: 14px 10px 12px; min-height: 0; overflow-y: auto; }
    .rl .g { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--cap-ink-3); padding: 14px 10px 8px; }
    .rl .g:first-child { padding-top: 4px; }
    .rl .lk { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px; border: 0; border-left: 2px solid transparent; background: transparent; font-size: 13.5px; font-weight: 700; color: var(--cap-ink-2); text-align: left; cursor: pointer; }
    .rl .lk:hover { background: var(--cap-panel); }
    .rl .lk .ic { color: var(--cap-ink-3); }
    .rl .lk b { margin-left: auto; font-size: 11.5px; font-weight: 800; color: var(--cap-ink-3); }
    .rl .lk.on { background: var(--cap-accent-well); border-left-color: var(--cap-accent); color: var(--cap-ink); }
    .rl .lk.on .ic { color: var(--cap-accent-txt); }
    .rl .ft { margin-top: auto; border-top: 1px solid var(--cap-line); padding: 12px 0 0; display: flex; flex-direction: column; gap: 9px; }
    .rl .ft .lk { margin-bottom: 4px; }
    .rl .ft .h { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--cap-ink-3); padding: 0 10px; }
    .rl .kv { display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 12.5px; color: var(--cap-ink-3); }
    .rl .kv .ic { color: var(--cap-ink-3); }
    .rl .kv b { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--cap-ink); font-weight: 700; text-align: right; white-space: nowrap; }
    .rl .kv b.ok { color: var(--cap-ok); }
    .mn { display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
    .view { display: none; flex: 1; min-height: 0; min-width: 0; flex-direction: column; }
    .view.show { display: flex; }
    /* page head */
    .ph { display: flex; align-items: center; gap: 18px; min-height: 64px; padding: 0 28px; border-bottom: 1px solid var(--cap-line); flex: none; }
    .ph .pre { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--cap-ink-3); white-space: nowrap; }
    .ph h1 { font-size: 24px; line-height: 1; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; white-space: nowrap; }
    .ph h1 span { color: var(--cap-accent-txt); }
    .ph .ld { font-size: 13px; color: var(--cap-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .ph .as { display: flex; align-items: baseline; gap: 18px; font-size: 12.5px; color: var(--cap-ink-3); white-space: nowrap; }
    .ph .as b { font-size: 18px; color: var(--cap-ink); font-weight: 700; margin-right: 5px; }
    .ph .as b.crit { color: var(--cap-crit); }
    .ph .act { margin-left: auto; display: flex; gap: 8px; flex: none; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid var(--cap-line); background: transparent; color: var(--cap-ink); font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
    .btn:hover:not(:disabled) { border-color: var(--cap-ink-3); }
    .btn.p { background: var(--cap-accent); border-color: var(--cap-accent); color: var(--cap-on-accent); }
    .btn.p:hover:not(:disabled) { background: var(--cap-accent-hover); border-color: var(--cap-accent-hover); }
    .btn.c { color: var(--cap-crit); border-color: rgba(253,164,175,.46); }
    .btn.s { height: 30px; padding: 0 10px; font-size: 11px; }
    .btn.g { border-color: transparent; color: var(--cap-ink-2); }
    .btn:disabled { opacity: .5; cursor: default; }
    .ib { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid var(--cap-line); background: transparent; color: var(--cap-ink-2); cursor: pointer; padding: 0; }
    .ib:hover:not(:disabled) { border-color: var(--cap-ink-3); color: var(--cap-ink); }
    .ib:disabled { opacity: .5; cursor: default; }
    .sc { flex: 1; min-height: 0; overflow: hidden; padding: 0 28px; display: flex; flex-direction: column; }
    .sc.scroll { overflow-y: auto; }
    .sec { border-top: 1px solid var(--cap-line); padding-top: 20px; margin-top: 28px; }
    .sec.first { border-top: 0; margin-top: 0; padding-top: 22px; }
    .sh { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
    .sh h2 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .sh span { font-size: 12.5px; color: var(--cap-ink-3); }
    .lab { font-size: 11px; font-weight: 800; letter-spacing: .13em; color: var(--cap-ink-3); }
    .mut { color: var(--cap-ink-3); }
    .big { display: flex; gap: 40px; align-items: flex-end; }
    .big .k { display: flex; flex-direction: column; gap: 6px; }
    .big .k b { font-size: 30px; line-height: 1; font-weight: 700; }
    .big .k span { font-size: 11px; font-weight: 800; letter-spacing: .13em; color: var(--cap-ink-3); }
    .big .k .tag { align-self: flex-start; }
    .big .k b.crit { color: var(--cap-crit); }
    .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border: 1px solid var(--cap-line); font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--cap-ink-2); white-space: nowrap; }
    .tag.crit { color: var(--cap-crit); border-color: rgba(253,164,175,.46); }
    .tag.warn { color: var(--cap-warn); border-color: rgba(251,191,36,.46); }
    .tag.fl { color: var(--cap-fleet); border-color: rgba(34,211,238,.42); }
    .tag.ok { color: var(--cap-ok); border-color: rgba(52,211,153,.42); }
    .tag.acc { color: var(--cap-on-accent); background: var(--cap-accent); border-color: var(--cap-accent); }
    .bar { height: 6px; background: var(--cap-panel-2); display: flex; overflow: hidden; }
    .bar i { display: block; height: 100%; }
    .duel { display: flex; height: 5px; width: 100%; }
    .duel i { display: block; height: 100%; }
    .av { border-radius: 50%; object-fit: cover; flex: none; display: block; background: var(--cap-panel-2); }
    .lg { width: 18px; height: 18px; flex: none; display: block; }
    .dist { display: flex; height: 8px; gap: 2px; }
    .dist i { display: block; height: 100%; }
    .ach { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; }
    .ach > span, .ach > button { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--cap-ink-2); }
    .ach > button { background: transparent; border: 1px solid transparent; padding: 2px 6px; margin: -2px -6px; cursor: pointer; }
    .ach > button:hover { border-color: var(--cap-line); }
    .ach > button.on { border-color: var(--cap-accent); background: var(--cap-accent-well); }
    .ach.filtering > button:not(.on) { opacity: .55; }
    .ach i.sw { width: 8px; height: 8px; display: inline-block; flex: none; }
    .ach b { color: var(--cap-ink-3); font-weight: 700; }
    .ring { position: relative; flex: none; }
    .ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; }
    table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.t th { text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--cap-ink-3); padding: 0 12px 8px; border-bottom: 1px solid var(--cap-line); white-space: nowrap; }
    table.t td { padding: 0 12px; height: 44px; border-bottom: 1px solid var(--cap-line-soft); white-space: nowrap; }
    table.t .r { text-align: right; }
    /* share bar + banner */
    .sharebar { display: flex; align-items: center; gap: 12px; padding: 10px 28px; border-bottom: 1px solid var(--cap-line); background: var(--cap-accent-well); font-size: 13px; flex: none; }
    .sharebar .ok { color: var(--cap-ok); display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
    .sharebar .u { flex: 1; display: flex; align-items: center; height: 32px; padding: 0 10px; border: 1px solid var(--cap-line); background: var(--cap-hull); font-size: 12.5px; color: var(--cap-ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sharebar .u:empty { visibility: hidden; }
    .sharebar.err .ok { color: var(--cap-crit); }
    .sharebar.err { background: var(--cap-crit-well); }
    .sharebar.pending .ok { color: var(--cap-ink-2); }
    .sharebar .grow { flex: 1; }
    /* list header + rows (Local) */
    .lh { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 210px 66px; gap: 14px; padding: 0 12px 8px 16px; border-bottom: 1px solid var(--cap-line); }
    .lh span { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--cap-ink-3); }
    .lst { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
    .lst > * { flex: none; }
    .lst > .empty { margin: auto; }
    #local-summary { border-bottom: 1px solid var(--cap-line); margin-bottom: 16px; padding-bottom: 22px; }
    .lr { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 210px 66px; gap: 14px; align-items: center; height: 48px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--cap-line-soft); color: var(--cap-ink); cursor: pointer; }
    .lr:hover { background: var(--cap-panel); }
    .lr.d3 { background: var(--cap-crit-well); }
    .lr .rb { position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; }
    .lr .nm { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .lr .nm b { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lr .nm b.miss { color: var(--cap-ink-3); font-weight: 400; font-style: italic; }
    .lr .sub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--cap-ink-3); white-space: nowrap; overflow: hidden; }
    .lr .sub span { overflow: hidden; text-overflow: ellipsis; }
    .lr .kl { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lr .tg { display: flex; gap: 5px; justify-content: flex-end; flex-wrap: nowrap; overflow: hidden; }
    .lr .rk { font-size: 12px; font-weight: 800; text-align: right; text-transform: capitalize; }
    .lprog { padding: 18px 0; color: var(--cap-ink-3); font-size: 13px; }
    .lprog .bar { height: 3px; margin-top: 8px; }
    .lprog .bar i { background: var(--cap-accent); width: 0; transition: width .2s; }
    .sum { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 48px; align-items: end; flex: none; }
    .dw { min-width: 0; }
    /* empty states */
    .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; max-width: 640px; color: var(--cap-ink-3); margin: auto; }
    .empty .ic { color: var(--cap-accent-txt); }
    .empty h2 { font-size: 20px; font-weight: 700; text-transform: uppercase; color: var(--cap-ink); }
    .empty p { font-size: 13.5px; }
    .stps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin: 14px 0 8px; text-align: left; border-top: 1px solid var(--cap-line); padding-top: 18px; }
    .stp { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
    .stp .n { font-size: 22px; font-weight: 700; color: var(--cap-accent-txt); }
    .stp b { font-size: 13.5px; color: var(--cap-ink); }
    /* D-Scan */
    .ds { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 32px; align-items: stretch; flex: 1; min-height: 0; padding-bottom: 12px; }
    .ds > div { min-height: 0; overflow-y: auto; padding-right: 6px; }
    .cr { display: grid; grid-template-columns: 150px minmax(0, 1fr) 34px; gap: 12px; align-items: center; height: 27px; font-size: 13px; }
    .cr b { text-align: right; font-weight: 700; }
    .cr .bar { height: 8px; }
    .shg { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
    .sr { display: grid; grid-template-columns: 30px minmax(0, 1fr) 40px; gap: 10px; align-items: center; height: 37px; border-bottom: 1px solid var(--cap-line-soft); font-size: 13px; }
    .sr img { width: 30px; height: 30px; display: block; }
    .sr span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sr b { text-align: right; font-weight: 700; }
    /* drawer */
    .ov { position: absolute; left: 0; right: 0; bottom: 0; top: 40px; background: rgba(10,10,12,.55); display: flex; justify-content: flex-end; align-items: stretch; z-index: 40; visibility: hidden; opacity: 0; transition: opacity .18s ease, visibility 0s linear .18s; }
    .ov.open { visibility: visible; opacity: 1; transition: opacity .18s ease; }
    .dr { width: 400px; max-width: 92vw; background: var(--cap-panel); border-left: 1px solid var(--cap-line); display: flex; flex-direction: column; min-height: 0; transform: translateX(24px); transition: transform .18s ease; }
    .ov.open .dr { transform: none; }
    .dr-h { display: flex; gap: 16px; padding: 18px 18px 16px; border-bottom: 1px solid var(--cap-line); flex: none; }
    .dr-p { width: 104px; height: 104px; object-fit: cover; flex: none; display: block; background: var(--cap-panel-2); }
    .dr-id { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1; }
    .dr-id h2 { font-size: 22px; line-height: 1.05; font-weight: 700; }
    .dr-o { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--cap-ink-2); }
    .dr-o span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dr-t { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .dr-s { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 18px; }
    .dr-k { display: flex; align-items: center; gap: 22px; }
    .dr-r { display: grid; grid-template-columns: 26px minmax(0, 1fr) 90px 26px; gap: 10px; align-items: center; height: 34px; font-size: 13px; border-bottom: 1px solid var(--cap-line-soft); }
    .dr-r > span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dr-r img { width: 26px; height: 26px; display: block; }
    .dr-r b { text-align: right; font-weight: 700; color: var(--cap-ink-2); }
    .dr-r.go { cursor: pointer; }
    .dr-r.go:hover { background: var(--cap-panel-2); }
    .dr-f { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--cap-line); flex: none; }
    .dr-f .btn { flex: 1; }
    .dr-msg { padding: 28px 18px; color: var(--cap-ink-3); font-size: 13.5px; }
    /* about */
    .ab { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; align-items: stretch; }
    .ab-l { display: flex; gap: 28px; align-items: flex-start; }
    .ab-m { color: var(--cap-accent); display: block; flex: none; }
    .ab-w { font-size: 28px; font-weight: 700; letter-spacing: .04em; }
    .ab-w span { color: var(--cap-accent-txt); }
    .ab-r { display: flex; flex-direction: column; gap: 22px; border-left: 1px solid var(--cap-line); padding-left: 32px; }
    .dz { border-top: 1px solid var(--cap-line); padding-top: 18px; margin-top: auto; }
    .wipe-confirm { display: flex; gap: 8px; margin-top: 10px; }

    /* ── Intel-specific ── */
    .hs { display: flex; align-items: center; gap: 18px; }
    .hs h2 { font-size: 18px; font-weight: 700; text-transform: uppercase; }
    .hs p { font-size: 13px; color: var(--cap-ink-3); margin-top: 3px; }
    .hs .btn { margin-left: auto; }
    .pulse { width: 14px; height: 14px; border-radius: 50%; background: var(--cap-ok); box-shadow: 0 0 0 6px rgba(52,211,153,.16); flex: none; margin: 0 6px; }
    .hs.off .pulse { background: var(--cap-ink-3); box-shadow: 0 0 0 6px rgba(179,174,166,.14); }
    .hg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
    .hc { display: flex; flex-direction: column; gap: 7px; color: var(--cap-accent-txt); }
    .hc b { font-size: 14px; color: var(--cap-ink); text-transform: uppercase; letter-spacing: .04em; }
    .hc p { font-size: 12.5px; color: var(--cap-ink-3); }
    .hrl { flex: 1; min-height: 0; overflow-y: auto; }
    .hr { display: grid; grid-template-columns: 72px minmax(0, 1fr) 8px 50px 14px; gap: 14px; align-items: center; height: 40px; border-bottom: 1px solid var(--cap-line-soft); font-size: 13px; color: var(--cap-ink-3); cursor: pointer; }
    .hr:hover { background: var(--cap-panel); }
    .hr .tag { justify-self: start; }
    .hr .dot { width: 8px; height: 8px; border-radius: 50%; }
    .hr .tx { color: var(--cap-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lh-bar { display: flex; align-items: center; gap: 10px; }
